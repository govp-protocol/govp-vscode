name: Extension conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run check
      - run: node scripts/demo.mjs
      - run: npm run package
      - run: shasum -a 256 output/govp-partner-workbench-0.3.0.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: govp-partner-workbench-0.3.0
          path: output/govp-partner-workbench-0.3.0.vsix
          if-no-files-found: error
