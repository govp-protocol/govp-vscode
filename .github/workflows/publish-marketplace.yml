name: Publish VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        default: 0.3.0

permissions:
  contents: read

jobs:
  publish:
    if: inputs.version == '0.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Verify immutable package identity
        run: |
          test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"
          test "$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")" = "gemacode.govp-partner-workbench"
      - name: Publish the checked VSIX
        run: npx vsce publish --packagePath output/govp-partner-workbench-0.3.0.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
